
name: Build Barcode Battle APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip
        run: |
          mkdir build-src
          unzip -q BarcodeBattleFold_v0.3.zip -d build-src

      - name: Build APK
        working-directory: build-src/BarcodeBattleAndroid
        run: gradle :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeBattle-APK
          path: build-src/BarcodeBattleAndroid/app/build/outputs/apk/debug/app-debug.ap
          k
